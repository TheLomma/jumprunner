<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#07071a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jump Runner">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.json">
<title>Jump Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #07071a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; border-radius: 8px; max-width: 100vw; max-height: 100vh; }
  #menu, #gameover {
    position: fixed; inset: 0;
    background: rgba(0,0,20,0.93);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #fff; text-align: center;
    z-index: 100; padding: 20px;
  }
  #gameover { display: none; }
  h1 { font-size: clamp(2em, 8vw, 3.5em); font-weight: 900; color: #7ee8fa; margin-bottom: 8px; letter-spacing: 4px; }
  h2 { font-size: clamp(1.5em, 6vw, 2.5em); color: #ff6b6b; margin-bottom: 10px; }
  .sub { color: #555; letter-spacing: 3px; font-size: clamp(0.6em, 2vw, 0.8em); text-transform: uppercase; margin-bottom: 12px; }
  p { color: #aaa; margin-bottom: 24px; font-size: clamp(0.75em, 2.5vw, 0.9em); line-height: 1.9; }
  button {
    background: linear-gradient(135deg, #7ee8fa, #80ff72);
    color: #0d0d2b; border: none; border-radius: 40px;
    padding: 14px 50px; font-size: clamp(0.85em, 3vw, 1em); font-weight: 800;
    cursor: pointer; letter-spacing: 2px; margin: 6px;
    text-transform: uppercase; -webkit-tap-highlight-color: transparent;
  }
  button.sec {
    background: transparent; color: #aaa;
    border: 2px solid #444; font-weight: 600;
  }
  .scores { display: flex; gap: 20px; margin: 16px 0; flex-wrap: wrap; justify-content: center; }
  .sc { background: rgba(255,255,255,0.05); border: 1px solid #333; border-radius: 10px; padding: 10px 20px; }
  .sc span { display: block; }
  .sc .label { font-size: 0.7em; color: #666; letter-spacing: 2px; text-transform: uppercase; }
  .sc .val { font-size: 1.8em; font-weight: 800; color: #7ee8fa; }
  .sc .val.gold { color: #ffd700; }
  #touch-hint { color: #444; font-size: 0.7em; margin-top: 16px; }
</style>
</head>
<body>

<div id="menu">
  <h1>JUMP RUNNER</h1>
  <div class="sub">Endless Side-Scroller</div>
  <p>Leertaste / &uarr; / W &mdash; Springen (Doppelsprung!)<br>ESC &mdash; Men&uuml; &nbsp;&middot;&nbsp; R &mdash; Neustart</p>
  <button onclick="startGame()">&#9654; SPIELEN</button>
  <div id="touch-hint">Auf Mobilger&auml;ten: Tippen zum Springen</div>
</div>

<div id="gameover">
  <h2>GAME OVER</h2>
  <p>So nah dran...</p>
  <div class="scores">
    <div class="sc"><span class="label">Score</span><span class="val" id="go-score">0</span></div>
    <div class="sc"><span class="label">Highscore</span><span class="val gold" id="go-hi">0</span></div>
  </div>
  <button onclick="startGame()">&#x1F504; NOCHMAL</button>
  <button class="sec" onclick="showMenu()">&#8592; MEN&Uuml;</button>
</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW = Math.min(window.innerWidth, 820);
  const maxH = Math.min(window.innerHeight, 460);
  canvas.width  = maxW;
  canvas.height = maxH;
  GY = canvas.height - 80;
}
window.addEventListener('resize', resize);

let GY = 380;
resize();

const GRAV = 0.6, JV = -13, BSPD = 5;
let state = 'menu';
let score = 0, hi = 0, lives = 3, frame = 0, spd = BSPD;
let obs = [], coins = [], parts = [], pups = [];
let ot = 0, ct = 0, puT = 0, bgX = 0;
let activePU = { shield: 0, slow: 0, magnet: 0 };
const PUC = { shield:'#7ee8fa', slow:'#80ff72', magnet:'#ff79c6' };
let P;

function mkPlayer() {
  P = { x:80, y:GY-46, w:36, h:46, vy:0, j:0, inv:0, dead:false, dt:0 };
}

const STARS = Array.from({length:120}, () => ({
  x: Math.random()*2000, y: Math.random()*300,
  r: Math.random()*1.5+0.3, b: Math.random()*Math.PI*2
}));

// Input
document.addEventListener('keydown', e => {
  if (['Space','ArrowUp','KeyW'].includes(e.code)) { e.preventDefault(); jump(); }
  if (e.code==='Escape' && state==='play') showMenu();
  if (e.code==='KeyR' && state!=='menu') startGame();
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

function jump() {
  if (state!=='play' || !P || P.dead) return;
  if (P.j < 2) { P.vy = JV; P.j++; burst(P.x+P.w/2, P.y+P.h, '#7ee8fa', 6); }
}

function burst(x, y, col, n) {
  for(let i=0;i<n;i++) {
    const a=Math.random()*Math.PI*2, s=2+Math.random()*3;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col,life:1,r:3+Math.random()*3});
  }
}

const OT = ['cactus','box','spike','bird'];
function spawnOb() {
  const t = OT[Math.floor(Math.random()*OT.length)];
  const o = {t, x:canvas.width+50};
  if      (t==='cactus') { o.h=50+Math.random()*25; o.w=28; o.y=GY; }
  else if (t==='box')    { o.h=36; o.w=36; o.y=GY; }
  else if (t==='spike')  { o.h=22; o.w=44; o.y=GY; }
  else                   { o.h=24; o.w=48; o.y=GY-90-Math.random()*50; o.wt=0; }
  obs.push(o);
}

function update() {
  frame++; score++;
  spd = BSPD * (1 + score/8000) * (activePU.slow>0 ? 0.5 : 1);
  bgX = (bgX + spd*0.3) % canvas.width;

  P.vy += GRAV; P.y += P.vy;
  if (P.y >= GY - P.h) { P.y = GY - P.h; P.vy = 0; P.j = 0; }
  if (P.inv > 0) P.inv--;

  ot++;
  if (ot >= Math.max(52, 130-score/180)) { spawnOb(); ot=0; }
  obs.forEach(o => { o.x -= spd; if(o.wt!==undefined) o.wt+=0.1; });
  obs = obs.filter(o => o.x > -100);

  ct++;
  if (ct >= 90) { coins.push({x:canvas.width+10, y:GY-30-Math.random()*90, r:9, a:0}); ct=0; }
  coins.forEach(c => { c.x-=spd; c.a+=0.08; });
  if (activePU.magnet>0) coins.forEach(c => {
    const dx=P.x+P.w/2-c.x, dy=P.y+P.h/2-c.y, d=Math.hypot(dx,dy);
    if(d<180&&d>1){c.x+=dx/d*6;c.y+=dy/d*6;}
  });
  coins = coins.filter(c => !c.done && c.x > -20);

  puT++;
  if (puT>=450) { pups.push({t:['shield','slow','magnet'][Math.floor(Math.random()*3)], x:canvas.width+20, y:GY-80-Math.random()*60, a:0}); puT=0; }
  pups.forEach(p => { p.x-=spd; p.a+=0.04; });
  pups = pups.filter(p => !p.done && p.x > -20);

  for(const k in activePU) { if(activePU[k]>0) activePU[k]--; }

  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life-=0.03; });
  parts = parts.filter(p => p.life>0);

  if (!P.dead && P.inv<=0) {
    const px2=P.x+5, pw2=P.w-10, py2=P.y+5, ph2=P.h-5;
    for (const o of obs) {
      const oy = o.y - o.h;
      if (px2<o.x+o.w && px2+pw2>o.x && py2<oy+o.h && py2+ph2>oy) {
        if (activePU.shield>0) {
          activePU.shield=0; P.inv=80;
          burst(P.x+P.w/2,P.y+P.h/2,'#7ee8fa',12);
          obs=obs.filter(x=>x!==o);
        } else {
          lives--; P.inv=100;
          burst(P.x+P.w/2,P.y+P.h/2,'#ff6b6b',14);
          if(lives<=0){P.dead=true;state='dead';P.vy=-10;}
        }
        break;
      }
    }
    coins.forEach(c => {
      if(c.done)return;
      if(Math.hypot(P.x+P.w/2-c.x,P.y+P.h/2-c.y) < P.w/2+c.r) { c.done=true; score+=30; burst(c.x,c.y,'#ffd700',5); }
    });
    pups.forEach(p => {
      if(p.done)return;
      if(Math.hypot(P.x+P.w/2-p.x,P.y+P.h/2-p.y) < 28) { p.done=true; activePU[p.t]=600; burst(p.x,p.y,PUC[p.t],10); }
    });
  }

  if (P.dead) { P.y+=P.vy; P.vy+=GRAV; P.dt++; if(P.dt>80) endGame(); }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  const sk=ctx.createLinearGradient(0,0,0,H);
  sk.addColorStop(0,'#07071a'); sk.addColorStop(1,'#1a0e33');
  ctx.fillStyle=sk; ctx.fillRect(0,0,W,H);

  STARS.forEach(s=>{
    const sx=((s.x-bgX*0.05)%W+W)%W;
    const alpha=0.4+0.6*Math.abs(Math.sin(frame*0.012+s.b));
    ctx.beginPath(); ctx.arc(sx,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${alpha})`; ctx.fill();
  });

  ctx.fillStyle='#2a1245';
  for(let i=0;i<5;i++){
    const bx=((i*200-bgX*0.1)%W+W)%W-100;
    ctx.beginPath(); ctx.moveTo(bx,GY); ctx.lineTo(bx+100,GY-130); ctx.lineTo(bx+200,GY); ctx.fill();
  }
  ctx.fillStyle='#1d0d36';
  for(let i=0;i<7;i++){
    const bx=((i*140-bgX*0.25)%W+W)%W-70;
    ctx.beginPath(); ctx.moveTo(bx,GY); ctx.lineTo(bx+70,GY-80); ctx.lineTo(bx+140,GY); ctx.fill();
  }

  ctx.fillStyle='#150828'; ctx.fillRect(0,GY,W,H-GY);
  ctx.beginPath(); ctx.moveTo(0,GY); ctx.lineTo(W,GY);
  ctx.strokeStyle='#7ee8fa'; ctx.lineWidth=2; ctx.stroke();
  ctx.strokeStyle='rgba(126,232,250,0.08)'; ctx.lineWidth=1;
  for(let i=0;i<20;i++){
    const x=((i*60)-bgX%60+60)%W;
    ctx.beginPath(); ctx.moveTo(x,GY); ctx.lineTo(x,H); ctx.stroke();
  }

  coins.forEach(c=>{
    if(c.done)return;
    const cy=c.y+Math.sin(c.a)*6;
    ctx.save(); ctx.shadowColor='#ffd700'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(c.x,cy,c.r,0,Math.PI*2);
    ctx.fillStyle='#ffd700'; ctx.fill(); ctx.restore();
  });

  pups.forEach(p=>{
    if(p.done)return;
    const py2=p.y+Math.sin(p.a)*8;
    ctx.save(); ctx.shadowColor=PUC[p.t]; ctx.shadowBlur=18;
    ctx.fillStyle=PUC[p.t]+'aa';
    ctx.beginPath(); ctx.roundRect(p.x-16,py2-16,32,32,8); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='bold 13px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.t==='shield'?'S':p.t==='slow'?'T':'M',p.x,py2);
    ctx.restore();
  });

  obs.forEach(o=>drawOb(o));

  parts.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.col; ctx.fill();
  });
  ctx.globalAlpha=1;

  if (P && (!P.dead || P.y < H+60)) {
    if (!(P.inv>0 && Math.floor(frame/5)%2===0)) drawPlayer();
  }

  drawHUD();
}

function drawPlayer() {
  const px=P.x, py=P.y, pw=P.w, ph=P.h, cx=px+pw/2;
  const onGround = P.j === 0;
  const ls = onGround ? Math.sin(frame*0.32)*6 : 0;
  ctx.save();

  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(cx, GY+4, 14, 4, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle='#1a2a5e';
  ctx.beginPath(); ctx.roundRect(px+7, py+ph-18, 9, 20, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(px+pw-16, py+ph-18, 9, 20, 3); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.roundRect(px+5, py+ph-4+ls, 13, 6, 3); ctx.fill();
  ctx.beginPath(); ctx.roundRect(px+pw-18, py+ph-4-ls, 13, 6, 3); ctx.fill();

  ctx.fillStyle='#1e3a8a';
  ctx.beginPath(); ctx.roundRect(px+3, py+20, pw-6, ph-22, 5); ctx.fill();
  ctx.fillStyle='#3b82f6';
  ctx.beginPath(); ctx.moveTo(cx-3,py+20); ctx.lineTo(cx-3,py+ph-22); ctx.lineTo(cx+3,py+ph-22); ctx.lineTo(cx+3,py+20); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1e3a8a';
  ctx.beginPath(); ctx.moveTo(px+3,py+20); ctx.lineTo(cx-3,py+28); ctx.lineTo(cx-3,py+20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(px+pw-3,py+20); ctx.lineTo(cx+3,py+28); ctx.lineTo(cx+3,py+20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#162d6e'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(px+3,py+20,pw-6,ph-22,5); ctx.stroke();

  ctx.fillStyle='#f5c8a0';
  ctx.beginPath(); ctx.arc(cx,py+13,15,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='#1a0f00';
  ctx.beginPath(); ctx.ellipse(cx,py+4,14,9,0,Math.PI,0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx-11,py+10,5,8,-0.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#2d1a00';
  ctx.beginPath(); ctx.ellipse(cx+3,py+3,7,5,0.2,Math.PI,0); ctx.fill();

  ctx.fillStyle='#f0b88a';
  ctx.beginPath(); ctx.ellipse(cx-14,py+13,4,5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+14,py+13,4,5,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='white';
  ctx.beginPath(); ctx.ellipse(cx-5,py+13,4,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+5,py+13,4,3.5,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a0800';
  ctx.beginPath(); ctx.arc(cx-4.5,py+13,2.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+5.5,py+13,2.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(cx-3.8,py+12.2,0.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6.2,py+12.2,0.8,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle='#1a0f00';
  ctx.beginPath(); ctx.moveTo(cx-8,py+9); ctx.quadraticCurveTo(cx-5,py+8,cx-2,py+9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+2,py+9); ctx.quadraticCurveTo(cx+5,py+8,cx+8,py+9); ctx.stroke();

  ctx.fillStyle='rgba(255,130,130,0.35)';
  ctx.beginPath(); ctx.ellipse(cx-9,py+17,4,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+9,py+17,4,2.5,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(cx,py+19,5,0,Math.PI); ctx.fill();
  ctx.strokeStyle='#c0704a'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,py+18,5.5,0.1,Math.PI-0.1); ctx.stroke();

  const wx=px+pw+2, wy=py+22;
  const wa=onGround?-0.4+Math.sin(frame*0.25)*0.1:-0.7;
  ctx.save();
  ctx.translate(wx,wy); ctx.rotate(wa);
  ctx.strokeStyle='#111'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,22); ctx.stroke();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(0,-2,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0,24,3,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.save(); ctx.shadowColor='#fff'; ctx.shadowBlur=8; ctx.fillStyle='rgba(255,255,255,0.9)';
  for(let i=0;i<4;i++){
    const a=frame*0.2+i*Math.PI/2;
    ctx.beginPath(); ctx.arc(wx+Math.cos(wa-1.5)+Math.cos(a)*5,wy+Math.sin(wa-1.5)-2+Math.sin(a)*5,1,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  if (activePU.shield>0) {
    ctx.beginPath(); ctx.arc(cx,py+ph/2,pw*0.95,0,Math.PI*2);
    ctx.strokeStyle='rgba(126,232,250,0.8)'; ctx.lineWidth=2.5;
    ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
  }

  if (P.j===2 && P.y<GY-P.h-2) {
    for(let i=0;i<5;i++){
      const a=frame*0.15+i*Math.PI*2/5;
      ctx.beginPath(); ctx.arc(cx+Math.cos(a)*20,py+ph/2+Math.sin(a)*12,2.5,0,Math.PI*2);
      ctx.fillStyle='#ffd700'; ctx.fill();
    }
  }
  ctx.restore();
}

function drawOb(o) {
  ctx.save();
  if (o.t==='cactus') {
    ctx.fillStyle='#2ecc71';
    ctx.beginPath(); ctx.roundRect(o.x+9,o.y-o.h,10,o.h,3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(o.x+1,o.y-o.h*0.55,o.w-2,7,3); ctx.fill();
    ctx.fillStyle='#27ae60';
    ctx.beginPath(); ctx.arc(o.x+o.w/2,o.y-o.h,5,Math.PI,0); ctx.fill();
  } else if (o.t==='box') {
    ctx.fillStyle='#f39c12';
    ctx.beginPath(); ctx.roundRect(o.x,o.y-o.h,o.w,o.h,4); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(o.x,o.y-o.h/2); ctx.lineTo(o.x+o.w,o.y-o.h/2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y-o.h); ctx.lineTo(o.x+o.w/2,o.y); ctx.stroke();
  } else if (o.t==='spike') {
    ctx.fillStyle='#a855f7';
    for(let i=0;i<3;i++){
      ctx.beginPath(); ctx.moveTo(o.x+i*14,o.y); ctx.lineTo(o.x+i*14+7,o.y-o.h); ctx.lineTo(o.x+i*14+14,o.y); ctx.closePath(); ctx.fill();
    }
  } else if (o.t==='bird') {
    const wy=Math.sin(o.wt)*9;
    ctx.fillStyle='#ef4444';
    ctx.beginPath(); ctx.ellipse(o.x+22,o.y+10,16,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#dc2626';
    ctx.beginPath(); ctx.ellipse(o.x+8,o.y+5+wy,11,4.5,-.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(o.x+36,o.y+5-wy,11,4.5,.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f59e0b';
    ctx.beginPath(); ctx.moveTo(o.x+40,o.y+8); ctx.lineTo(o.x+48,o.y+11); ctx.lineTo(o.x+40,o.y+13); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  const W=canvas.width;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(14,14,120,52,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='9px sans-serif';
  ctx.textAlign='left'; ctx.fillText('SCORE',22,28);
  ctx.fillStyle='#7ee8fa'; ctx.font='bold 20px sans-serif';
  ctx.fillText(Math.floor(score/10),22,48);

  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(W-134,14,120,52,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='9px sans-serif';
  ctx.textAlign='right'; ctx.fillText('HIGHSCORE',W-22,28);
  ctx.fillStyle='#ffd700'; ctx.font='bold 20px sans-serif';
  ctx.fillText(Math.floor(hi/10),W-22,48);

  ctx.textAlign='center';
  const mid=W/2;
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.roundRect(mid-55,14,110,52,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.font='9px sans-serif';
  ctx.fillText('LEBEN',mid,28);
  for(let i=0;i<3;i++){
    ctx.fillStyle = i<lives ? '#ff6b6b' : 'rgba(255,255,255,0.1)';
    ctx.font='18px sans-serif';
    ctx.fillText('\u2665',mid-28+i*28,48);
  }

  let px2=10, py2=canvas.height-36;
  for(const k in activePU){
    if(activePU[k]>0){
      ctx.fillStyle=PUC[k]+'cc';
      ctx.beginPath(); ctx.roundRect(px2,py2,70,22,11); ctx.fill();
      ctx.fillStyle='#0d0d2b'; ctx.font='bold 10px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(k.toUpperCase(),px2+35,py2+15);
      px2+=78;
    }
  }

  const pct=Math.min(1,(spd/BSPD-1)*3+0.1);
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.roundRect(W-90,canvas.height-30,76,16,4); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='8px sans-serif';
  ctx.textAlign='left'; ctx.fillText('SPEED',W-88,canvas.height-18);
  ctx.fillStyle=`hsl(${180-pct*140},90%,60%)`;
  ctx.beginPath(); ctx.roundRect(W-88+32,canvas.height-27,Math.max(4,pct*38),10,3); ctx.fill();
}

function endGame() {
  state='over';
  if(score>hi) hi=score;
  document.getElementById('go-score').textContent=Math.floor(score/10);
  document.getElementById('go-hi').textContent=Math.floor(hi/10);
  document.getElementById('gameover').style.display='flex';
}

function showMenu() {
  state='menu';
  document.getElementById('menu').style.display='flex';
  document.getElementById('gameover').style.display='none';
}

function startGame() {
  document.getElementById('menu').style.display='none';
  document.getElementById('gameover').style.display='none';
  score=0; lives=3; frame=0; spd=BSPD;
  obs=[]; coins=[]; parts=[]; pups=[];
  activePU={shield:0,slow:0,magnet:0};
  ot=0; ct=30; puT=0; bgX=0;
  mkPlayer();
  state='play';
}

function loop() {
  if(state==='play'||state==='dead') update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
